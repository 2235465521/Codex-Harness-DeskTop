name: Release Codex Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build UI & Pack Installer
        run: npm run build

      - name: Run Full Test Suite
        run: npm test

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/v*/*.exe
            release/v*/*.blockmap
            release/v*/RELEASE_NOTES.md
            release/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Extraneous Release Assets
        uses: actions/github-script@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (rel && rel.data && rel.data.assets) {
                for (const asset of rel.data.assets) {
                  if (asset.name === 'Codex.Desktop.exe' || asset.name === 'elevate.exe') {
                    console.log(`Deleting bad asset ${asset.name} (id ${asset.id})`);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                    console.log(`Successfully deleted ${asset.name}`);
                  }
                }
              }
            } catch (err) {
              console.error('Asset cleanup failed:', err);
              throw err;
            }
